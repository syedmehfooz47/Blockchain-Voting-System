<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraVote - Decentralized Voting Platform</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Poppins:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>

    <div class="main-container">
        <header class="header">
            <div class="logo">
                <h1>AuraVote</h1>
            </div>
            <h2>Secure, Transparent, Decentralized.</h2>
        </header>
        
        <section class="content">
            <div id="vote-box" class="vote-box">
                <h3>Cast Your Ballot</h3>
                <div id="vote-container" class="vote-row">
                    </div>
            </div>

            <div id="live-results-box" class="live-results-box">
                <h3>Live Election Results</h3>
                <ul id="results-list"></ul>
            </div>
        </section>
        
        <div id="status-container">
            <p id="status"></p>
        </div>
        
        <div id="loading-overlay" class="hidden">
            <div class="spinner"></div>
            <p>Processing Transaction...</p>
        </div>
        
    </div>

    <footer class="footer">
        <p>&copy; 2025 AuraVote Platform. All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/gh/ethereum/web3.js/dist/web3.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
